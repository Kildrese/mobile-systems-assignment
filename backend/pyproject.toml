[project]
name = "mobile-systems-api"
version = "0.1.0"
description = "FastAPI backend for the Mobile Systems app"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# FastAPI's `Depends(...)` in defaults is the documented pattern.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `backend/alembic/` would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_tracker"]
addopts = ["--strict-markers", "-ra"]
