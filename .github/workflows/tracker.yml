# The daily internship tracker. Runs the tracker, then copies its latest run into the
# production database, where the API serves it read-only.
#
# `workflow_dispatch` is the only trigger. The backend's Vercel cron (`backend/vercel.json`)
# dispatches it once a day between 09:00 and 09:59 UTC, through a route only the cron can
# reach, which claims the day in `tracker_dispatches` so a duplicate call never starts a
# second run. Repository writers can also start a run from the Actions tab. There is no
# `schedule`: GitHub never started a scheduled run of this workflow, and if it ever did,
# that run would bypass the once-a-day claim.
#
# The route dispatches with `source: cron`. If GitHub accepted a dispatch the route then
# retried (a timeout proves nothing), the `guard` job of the later cron run sees the earlier
# one and skips the day's work, so a day never pays for two cron runs. Manual runs are never
# skipped.
#
# Secrets: GROQ_API_KEY, TAVILY_API_KEY, DATABASE_URL (Neon, pooled), VERIFIER_URL and
# VERIFIER_TOKEN (the verifier service; without them claims show as unverified),
# DRAFTER_URL, DRAFTER_TOKEN and DRAFTING_USERS (the drafter; without them nothing is drafted).
name: Internship tracker

on:
  workflow_dispatch:
    inputs:
      source:
        description: Who started the run (the daily cron sends `cron`)
        default: manual

run-name: Internship tracker (${{ inputs.source }})

# Never two runs at once: they share the state file.
concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Another cron run already started today, earlier than this one: skip. Run numbers only
  # grow, so of two cron runs created together exactly one goes on. If GitHub can't be
  # asked, the job fails and nothing runs (never risk a second paid run).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: inputs.source == 'cron'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          earlier=$(gh api -X GET "repos/$REPO/actions/workflows/tracker.yml/runs" \
            -f event=workflow_dispatch -f created=">=$(date -u +%F)" -F per_page=100 \
            --jq "[.workflow_runs[] | select(.display_title | endswith(\"(cron)\"))
                   | select(.run_number < $RUN_NUMBER)] | length")
          echo "Earlier cron runs today: $earlier"
          echo "skip=$([ "$earlier" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      VERIFIER_URL: ${{ secrets.VERIFIER_URL }}
      VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRAFTER_URL: ${{ secrets.DRAFTER_URL }}
      DRAFTER_TOKEN: ${{ secrets.DRAFTER_TOKEN }}
      DRAFTING_USERS: ${{ secrets.DRAFTING_USERS }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked

      # The state file carries the watchlist, known offers and HTTP validators from day
      # to day. Each run saves a new cache entry and restores the newest one.
      # ponytail: an evicted cache (7 days unused) starts the tracker from scratch, so
      # every open offer shows as new once; move state to durable storage if that matters.
      - uses: actions/cache/restore@v4
        with:
          path: .tracker
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      # Exit 1 means nothing ran (bad policy or key): fail without publishing.
      # 0 complete, 2 partial and 3 provider failure all wrote a report worth publishing.
      - name: Run the tracker
        run: uv run python -m tracker run || [ $? -ne 1 ]

      # Exit 1 left the state untouched, so saving it again is harmless.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .tracker
          key: tracker-state-${{ github.run_id }}

      - name: Publish the report
        run: uv run python -m app.publish_report

      # CV drafts for the new top-K offers. A failure is stored on each draft row and
      # never fails the job: the run is already published.
      - name: Draft applications
        continue-on-error: true
        run: uv run python -m app.draft_new

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-${{ github.run_id }}
          path: |
            reports/
            traces/
          retention-days: 14
