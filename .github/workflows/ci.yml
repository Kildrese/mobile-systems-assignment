# Checks every pull request and every push to master. Vercel deploys on its
# own through its GitHub integration (and migrates Neon on production builds,
# see scripts/vercel-build.sh), so no secrets are needed here.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run openapi:check
