# Checks every pull request and every push to master. No secrets needed: the
# backend job runs against its own Postgres service container.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python -m app.openapi --check
      - run: uv run alembic upgrade head
      # Models and migrations agree: autogenerate would produce nothing.
      - run: uv run alembic check

      - name: Smoke test
        run: |
          uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/healthz >/dev/null && break; sleep 1; done
          ../scripts/api-smoke.sh

      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
